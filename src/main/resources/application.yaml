spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  config:
    import: optional:file:.env[.properties]

  application:
    name: webstore
  
  datasource:
    url: jdbc:mariadb://localhost:3306/${WEBSTORE_DB:webstore}
    username: webstore_user
    password: ${WEBSTORE_USER_PASSWORD}
